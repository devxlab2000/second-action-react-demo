name: test project
on: [push, workflow_dispatch]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Get code
            uses: actions/checkout@v4
          - name: Install Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 16
          - name: Install dependencies
            run: npm install
          - name: Run tests
            run: npm test
    deploy: 
        runs-on: ubuntu-latest
        steps:
          - name: Get code
            uses: actions/checkout@v4
          - name: Install Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 16
          - name: Install dependencies
            run: npm install
          - name: Build project
            run: npm run build
          - name: Deploy
            run: echo "Deploying project..." # Replace with your deployment command
