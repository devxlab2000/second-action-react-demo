name: test project
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Get code
            uses: actions/checkout@v4
          - name: Install Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 16
          - name: Install dependencies
            run: npm install
          - name: Run tests
            run: npm test
            